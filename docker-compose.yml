services:
  healthtrack:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env            # contains MISTRAL_API_KEY; never baked into the image
    volumes:
      - healthtrack-logs:/app/logs
    restart: unless-stopped
    read_only: true      # immutable container filesystem...
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

volumes:
  healthtrack-logs:      # ...except the named volume that holds the log files
